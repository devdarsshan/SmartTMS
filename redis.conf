# Redis Configuration for SmartTMS
# Basic configuration optimized for development and testing

# Network settings
bind 0.0.0.0
port 6379
protected-mode yes

# Authentication
requirepass smarttms123

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence settings for development
save 900 1
save 300 10
save 60 10000

# Logging
loglevel notice
logfile ""

# Database settings
databases 16

# Performance tuning
tcp-keepalive 300
timeout 300

# AOF (Append Only File) settings for better durability
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Client settings
tcp-backlog 511
maxclients 10000

# Security settings (disable dangerous commands in production)
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command KEYS ""
# rename-command CONFIG ""
