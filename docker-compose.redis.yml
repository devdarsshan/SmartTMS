version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: smarttms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-smarttms123}
    networks:
      - smarttms-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: smarttms-redis-ui
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-smarttms123}
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - smarttms-network

volumes:
  redis_data:
    driver: local

networks:
  smarttms-network:
    driver: bridge
