version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: smarttms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --requirepass ${REDIS_PASSWORD:-smarttms123}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-smarttms123}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - smarttms-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: smarttms-redis-ui
    restart: unless-stopped
    environment:
      # Format: name:host:port:db:password
      - REDIS_HOSTS=redis:redis:6379:0:${REDIS_PASSWORD:-smarttms123}
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - smarttms-network

volumes:
  redis_data:
    driver: local

networks:
  smarttms-network:
    driver: bridge
