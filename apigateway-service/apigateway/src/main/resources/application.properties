spring.application.name=apigateway
server.port=7082
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
jwt.secret=c21hcnRsb2dpc3RpY3Nqd3RzZWNyZXRrZXlzbWFydGxvZ2lzdGljc2p3dHNlY3JldGtleQ==

# Logging Configuration
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.server=DEBUG
logging.level.com.smartlogistics.apigateway=DEBUG

# Redis Configuration (matches auth-service configuration)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=smarttms123
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-wait=-1ms
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.key-prefix=gateway:

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=order-service
spring.cloud.gateway.routes[1].uri=lb://order-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/order/**

spring.cloud.gateway.routes[2].id=tracking-service
spring.cloud.gateway.routes[2].uri=lb://tracking-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/track/**

spring.cloud.gateway.routes[3].id=user-service
spring.cloud.gateway.routes[3].uri=lb://user-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/user/**

spring.cloud.gateway.routes[4].id=vehicle-service
spring.cloud.gateway.routes[4].uri=lb://vehicle-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/vehicle/**

# Rate Limiting Configuration
rate.limiting.enabled=true
rate.limiting.requests.per.minute=100
