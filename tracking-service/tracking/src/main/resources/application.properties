spring.application.name=tracking-service
server.port=7085
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:smarttms@123}
spring.data.redis.timeout=2000ms
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=2
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

app.kafka.topics.vehicle-location-events=${VEHICLE_LOCATION_EVENTS_TOPIC:vehicle-location-events}
app.kafka.topics.vehicle-events=${VEHICLE_EVENTS_TOPIC:vehicle-events}
app.kafka.publish.max-attempts=${KAFKA_PUBLISH_MAX_ATTEMPTS:3}
app.kafka.publish.backoff-ms=${KAFKA_PUBLISH_BACKOFF_MS:500}
app.kafka.consumer.retry-attempts=${KAFKA_CONSUMER_RETRY_ATTEMPTS:2}
app.kafka.consumer.backoff-ms=${KAFKA_CONSUMER_BACKOFF_MS:1000}
app.tracking.location.ttl-seconds=${TRACKING_LOCATION_TTL_SECONDS:60}
app.tracking.timestamp.max-age-seconds=${TRACKING_MAX_AGE_SECONDS:120}
app.tracking.cache.sync-interval-ms=${TRACKING_CACHE_SYNC_INTERVAL_MS:60000}
