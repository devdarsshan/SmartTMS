spring.application.name=analytics-service
server.port=7081
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost
spring.datasource.url=jdbc:mysql://localhost:3306/smarttms
spring.datasource.username=root
spring.datasource.password=mysqlpass
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

app.kafka.topics.order-events=${ORDER_EVENTS_TOPIC:order-events}
app.kafka.topics.vehicle-events=${VEHICLE_EVENTS_TOPIC:vehicle-events}
app.kafka.topics.vehicle-location-events=${VEHICLE_LOCATION_EVENTS_TOPIC:vehicle-location-events}
app.kafka.consumer.retry-attempts=${KAFKA_CONSUMER_RETRY_ATTEMPTS:2}
app.kafka.consumer.backoff-ms=${KAFKA_CONSUMER_BACKOFF_MS:1000}
app.analytics.location.jump-threshold-km=${ANALYTICS_LOCATION_JUMP_THRESHOLD_KM:50}
app.analytics.live-window-seconds=${ANALYTICS_LIVE_WINDOW_SECONDS:60}


# Observability / Tracing / Metrics
management.tracing.sampling.probability=1.0
management.endpoints.web.exposure.include=prometheus,health,info,metrics
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
management.metrics.tags.application=${spring.application.name}

# Config Server Client
spring.config.import=optional:configserver:http://localhost:8888

# Resilience4j Circuit Breaker
spring.cloud.openfeign.circuitbreaker.enabled=true
resilience4j.circuitbreaker.instances.default.slidingWindowSize=10
resilience4j.circuitbreaker.instances.default.failureRateThreshold=50
resilience4j.circuitbreaker.instances.default.waitDurationInOpenState=10000ms
resilience4j.circuitbreaker.instances.default.permittedNumberOfCallsInHalfOpenState=3
